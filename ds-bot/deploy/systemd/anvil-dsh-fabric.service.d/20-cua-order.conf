# Layer 1 CUA boot/restart ordering for ANVIL DSH Fabric (user systemd unit).
# Keeps DSH startup non-blocking if GUI / CUA is absent or slow; Layer 2 backoff
# in ds-bot capabilities handles late startup or runtime socket drops.

[Unit]
Wants=cua-driver.service
After=cua-driver.service

[Service]
Environment=CUA_SOCKET_WAIT_SECS=35
ExecStartPre=/bin/sh -c 'sock="${CUA_DRIVER_SOCKET:-%h/.cache/cua-driver/cua-driver.sock}"; [ -S "$sock" ] && exit 0; systemctl --user is-active --quiet cua-driver.service || exit 0; i=0; max="${CUA_SOCKET_WAIT_SECS:-35}"; while [ "$i" -lt "$max" ]; do [ -S "$sock" ] && exit 0; systemctl --user is-active --quiet cua-driver.service || exit 0; sleep 1; i=$((i + 1)); done; exit 0'
